[package]
name = "rust_video_stream"
version = "0.1.0"
edition = "2024"

[dependencies]
video-rs = { version = "0.10.5", optional = true }
zmq = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
base64 = "0.22.1"
redis = { version = "0.27.5", features = ["streams"] }
serde-pickle = "1.1.1"

[features]
default = []
