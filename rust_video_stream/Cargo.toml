[package]
name = "rust_video_stream"
version = "0.1.0"
edition = "2024"

[dependencies]
zmq = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
base64 = "0.22.1"
redis = { version = "0.27.5", features = ["streams"] }
serde-pickle = "1.1.1"
ffmpeg-next = "8.0.0"
rmp-serde = "1.3"
rmpv = "1.3"

[features]
default = []
